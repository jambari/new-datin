{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifikasi OTP — BMKG Jayapura</title>
  <link rel="icon" href="{% static 'favicon.ico' %}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100" style="font-family:Inter,system-ui,-apple-system,sans-serif;">

<div class="w-full max-w-md mx-4">
  <div class="text-center mb-8">
    <img src="{% static 'theme/images/logo.jpeg' %}" alt="Logo" class="w-20 h-auto mx-auto mb-4 rounded-xl shadow">
    <h1 class="text-2xl font-extrabold text-gray-900">Verifikasi OTP</h1>
    <p class="text-sm text-gray-500 mt-1">{{ user.username }}</p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">

    {% if msg %}
    <div class="mb-4 px-3 py-2 bg-red-50 text-red-700 text-sm rounded-lg">{{ msg }}</div>
    {% endif %}

    <p class="text-sm text-gray-600 mb-4">Masukkan kode 6-digit dari aplikasi Google Authenticator / Authy.</p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Kode OTP</label>
        <input type="text" name="otp_token" maxlength="6" autocomplete="off" autofocus
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-center text-2xl tracking-widest" placeholder="000000" required>
      </div>
      <button type="submit" style="width:100%;padding:12px 0;background:#2563eb;color:#fff;font-size:14px;font-weight:600;border:none;border-radius:12px;cursor:pointer;">
        Verifikasi
      </button>
    </form>

    <div class="mt-4 text-center">
      <a href="{% url 'logout' %}" class="text-sm text-gray-400 hover:text-gray-600">Batal & logout</a>
    </div>
  </div>
</div>

</body>
</html>
