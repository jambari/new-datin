{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Stasiun Geofisika Jayapura BMKG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f3f4f6;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:3rem 1rem}
.wrap{max-width:400px;margin:0 auto;width:100%}
.logo{text-align:center;margin-bottom:2rem}
.logo img{height:64px;width:auto;display:block;margin:0 auto}
.logo h1{margin-top:1rem;font-size:1.5rem;font-weight:800;color:#111827}
.card{background:#fff;padding:2rem;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.875rem;font-weight:500;color:#374151;margin-bottom:.25rem}
.form-group input{display:block;width:100%;padding:.5rem .75rem;border:1px solid #d1d5db;border-radius:6px;font-size:.875rem;outline:none;transition:border-color .15s}
.form-group input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.btn-submit{width:100%;padding:.5rem .75rem;background:#6366f1;color:#fff;border:none;border-radius:6px;font-size:.875rem;font-weight:600;cursor:pointer;transition:background .15s}
.btn-submit:hover{background:#4f46e5}
.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:.75rem;border-radius:6px;font-size:.875rem;margin-bottom:1rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <img src="{% static 'theme/images/logo.jpeg' %}" alt="BMKG">
    <h1>Sign in</h1>
  </div>
  <div class="card">
    <form action="{% url 'login' %}" method="post">
      {% csrf_token %}
      {% if form.errors %}
      <div class="error">Your username and password didn't match. Please try again.</div>
      {% endif %}
      <div class="form-group">
        <label for="id_username">Username</label>
        <input id="id_username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="id_password">Password</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-submit">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
