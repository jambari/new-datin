{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Aplikasi Chang'e</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    {% tailwind_css %}
    <style>
      /* Sidebar layout normalization — high-specificity rules in <head> so
         any per-page Bootstrap link (loaded in <body>) cannot override them */
      #sidebar > nav > ul { padding: 0 !important; margin: 0 !important; list-style: none !important; }
      #sidebar > nav > ul > li { list-style: none !important; margin: 0 !important; padding: 0 !important; }
      #sidebar > nav > ul > li > a,
      #sidebar > nav > ul > li > button { border: none; margin: 0; }
    </style>
</head>
<body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    {% block content %}
    {% endblock %}

    {% block extra_scripts %}{% endblock %}



</body>
</html>
