{% extends "base.html" %}
{% load tz %}
{% block content %}
<div class="flex h-screen bg-gray-100">
  {% include 'partials/_sidebar.html' %}
  <div class="flex-1 flex flex-col overflow-hidden">
    {% include 'partials/_topbar.html' %}
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-8">
      <div style="max-width:640px;margin:0 auto;">
        <h1 style="font-size:22px;font-weight:700;color:#111827;margin-bottom:24px;">Edit Gempa</h1>
        <form method="post" style="background:#fff;padding:24px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);">
          {% csrf_token %}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">

            <div style="grid-column:1/-1;">
              <label style="font-size:13px;font-weight:500;color:#374151;">Station Code</label>
              <input name="station_code" value="{{ gempa.station_code }}"
                style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;box-sizing:border-box;">
            </div>

            <div style="grid-column:1/-1;">
              <label style="font-size:13px;font-weight:500;color:#374151;">Origin Datetime (UTC)</label>
              <input name="origin_datetime" type="datetime-local"
                value="{{ gempa.origin_datetime|date:'Y-m-d' }}T{{ gempa.origin_datetime|time:'H:i' }}"
                style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;box-sizing:border-box;">
            </div>

            <div>
              <label style="font-size:13px;font-weight:500;color:#374151;">Latitude</label>
              <input name="latitude" type="number" step="any" value="{{ gempa.latitude }}"
                style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;box-sizing:border-box;">
            </div>
            <div>
              <label style="font-size:13px;font-weight:500;color:#374151;">Longitude</label>
              <input name="longitude" type="number" step="any" value="{{ gempa.longitude }}"
                style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;box-sizing:border-box;">
            </div>

            <div>
              <label style="font-size:13px;font-weight:500;color:#374151;">Magnitudo</label>
              <input name="magnitudo" type="number" step="0.1" value="{{ gempa.magnitudo }}"
                style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;box-sizing:border-box;">
            </div>
            <div>
              <label style="font-size:13px;font-weight:500;color:#374151;">Depth (km)</label>
              <input name="depth" type="number" value="{{ gempa.depth }}"
                style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;box-sizing:border-box;">
            </div>

            <div style="grid-column:1/-1;">
              <label style="font-size:13px;font-weight:500;color:#374151;">Remark</label>
              <input name="remark" value="{{ gempa.remark }}"
                style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;box-sizing:border-box;">
            </div>

            <div>
              <label style="font-size:13px;font-weight:500;color:#374151;">Felt</label>
              <select name="felt" style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;box-sizing:border-box;">
                <option value="false" {% if not gempa.felt %}selected{% endif %}>No</option>
                <option value="true" {% if gempa.felt %}selected{% endif %}>Yes</option>
              </select>
            </div>

            <div>
              <label style="font-size:13px;font-weight:500;color:#374151;">Impact</label>
              <input name="impact" value="{{ gempa.impact|default:'' }}"
                style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;box-sizing:border-box;">
            </div>

          </div>

          <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end;">
            <a href="{% url 'gempa_list' %}" style="padding:8px 20px;background:#f3f4f6;border-radius:6px;font-size:14px;color:#374151;text-decoration:none;font-weight:500;border:1px solid #e5e7eb;">Batal</a>
            <button type="submit" style="padding:8px 20px;background:#4f46e5;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;">Simpan</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
{% endblock %}
