{% extends "base.html" %}
{% block content %}
<div class="flex h-screen bg-gray-100">
  {% include 'partials/_sidebar.html' %}
  <div class="flex-1 flex flex-col overflow-hidden">
    {% include 'partials/_topbar.html' %}
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-8">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-3xl font-bold text-gray-900">Edit Event</h1>
        <a href="{% url 'event_browser_list' %}" class="px-4 py-2 text-sm bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">&larr; Kembali</a>
      </div>

      <div class="bg-white shadow rounded-lg p-6 max-w-2xl">
        <div class="mb-4 p-3 bg-gray-50 rounded-md text-sm text-gray-500">
          <span class="font-semibold text-gray-700">Event ID:</span> {{ object.event_id }}
        </div>
        <form method="POST">
          {% csrf_token %}
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Origin Time (UTC)</label>
              <input type="datetime-local" name="origin_time"
                value="{{ object.origin_time|date:'Y-m-d\TH:i' }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Author</label>
              <input type="text" name="author" value="{{ object.author }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Magnitudo</label>
              <input type="number" step="0.01" name="magnitude" value="{{ object.magnitude }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Kedalaman (km)</label>
              <input type="number" step="0.1" name="depth_km" value="{{ object.depth_km }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
              <input type="number" step="any" name="latitude" value="{{ object.latitude }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
              <input type="number" step="any" name="longitude" value="{{ object.longitude }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">Kota Terdekat</label>
              <input type="text" name="nearest_city" value="{{ object.nearest_city }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi</label>
              <input type="text" name="location" value="{{ object.location }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
          </div>
          <div class="mt-6 flex justify-end space-x-3">
            <a href="{% url 'event_browser_list' %}" class="px-4 py-2 text-sm bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">Batal</a>
            <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-700">Simpan</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
{% endblock %}
