{% load static %}{% load l10n %}{# Peta Leaflet template-balai: episenter + sesar + batas + kota-kota Papua. Dipakai juga oleh halaman publik gempa-publik. Konteks: map_lat, map_lon; elemen #map-baru harus sudah ada. Butuh Leaflet, esri-leaflet, L.Icon.Pulse dan berkas gjson dimuat lebih dulu. #}
<script>
var mymap = L.map('map-baru').setView([{{ map_lat|unlocalize }}, {{ map_lon|unlocalize }}], 7);
var layer = L.esri.basemapLayer('Imagery').addTo(mymap);
var layerLabels;
function setBasemap(basemap){
  if(layer){mymap.removeLayer(layer);}
  layer=L.esri.basemapLayer(basemap);mymap.addLayer(layer);
  if(layerLabels){mymap.removeLayer(layerLabels);}
  if(['ShadedRelief','Oceans','Gray','DarkGray','Terrain'].includes(basemap)){layerLabels=L.esri.basemapLayer(basemap+'Labels');mymap.addLayer(layerLabels);}
  else if(basemap.includes('Imagery')){layerLabels=L.esri.basemapLayer('ImageryLabels');mymap.addLayer(layerLabels);}
}
var eqIcon=L.icon({iconUrl:'{% static "images/earthquake.png" %}',iconSize:[40,40]});
