{% extends 'layanan/base.html' %}
{% load static %}

{% block title %}Magang — BukaData{% endblock %}

{% block content %}
<section class="max-w-5xl mx-auto px-4 py-12">
  <nav class="flex items-center gap-2 text-sm text-gray-500 mb-8">
    <a href="{% url 'layanan_landing' %}" class="hover:text-brand">Home</a><span>/</span>
    <span class="text-gray-900 font-medium">Magang</span>
  </nav>
  <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-8">Magang</h1>
  <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-12">
    {% for i in "123456789" %}
    <img src="{% static 'images/layanan/magang/' %}{{ forloop.counter }}.jpg" alt="Magang {{ forloop.counter }}" class="w-full h-40 object-cover rounded-xl shadow-sm">
    {% endfor %}
  </div>
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Formulir Permohonan Magang</h2>
    {% include 'layanan/_form.html' with jenis_default="Magang" %}
  </div>
</section>
{% endblock %}
