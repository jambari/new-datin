{% if messages %}
<div class="mb-5 space-y-2">
  {% for m in messages %}
  <div class="flex gap-3 items-start rounded-xl border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-800">
    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    <span>{{ m }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}
{% if form_errors %}
<div class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
  <p class="font-semibold mb-1">Permohonan belum terkirim:</p>
  <ul class="list-disc pl-5 space-y-0.5">{% for e in form_errors %}<li>{{ e }}</li>{% endfor %}</ul>
</div>
{% endif %}
<form method="POST" enctype="multipart/form-data" class="space-y-5">
  {% csrf_token %}
  <div class="hidden" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
      <input type="text" name="nama" value="{{ form_data.nama|default:'' }}" maxlength="255" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Instansi / Perusahaan</label>
      <input type="text" name="instansi" value="{{ form_data.instansi|default:'' }}" maxlength="255" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Alamat</label>
      <input type="text" name="alamat" value="{{ form_data.alamat|default:'' }}" maxlength="255" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" name="email" value="{{ form_data.email|default:'' }}" maxlength="255" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">No Telepon / HP</label>
      <input type="text" name="handphone" value="{{ form_data.handphone|default:'' }}" maxlength="255" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Data</label>
      <input type="text" name="jenis_data" value="{{ form_data.jenis_data|default:jenis_default|default:'' }}" maxlength="255" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm bg-gray-50">
    </div>
  </div>
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Unggah Surat Permohonan</label>
    <div class="flex items-center gap-3">
      <label class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl cursor-pointer transition">
        Pilih File
        <input type="file" name="surat" required accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" class="hidden">
      </label>
      <span class="text-sm text-gray-400 file-name">Belum ada file</span>
    </div>
    <p class="text-xs text-gray-400 mt-1.5">PDF, JPG, PNG, atau DOC/DOCX, maksimal 10 MB.</p>
  </div>
  <button type="submit" class="w-full py-3 bg-brand hover:bg-brand-dark text-white font-semibold rounded-xl transition shadow-md">
    Kirim Permohonan
  </button>
</form>
<script>
  document.querySelector('input[type=file]').addEventListener('change', function(e) {
    var name = e.target.files[0] ? e.target.files[0].name : 'Belum ada file';
    document.querySelector('.file-name').textContent = name;
  });
</script>
