<form method="POST" enctype="multipart/form-data" class="space-y-5">
  {% csrf_token %}
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
      <input type="text" name="nama" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Instansi / Perusahaan</label>
      <input type="text" name="instansi" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Alamat</label>
      <input type="text" name="alamat" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" name="email" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">No Telepon / HP</label>
      <input type="text" name="handphone" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Data</label>
      <input type="text" name="jenis_data" value="{{ jenis_default|default:'' }}" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition text-sm bg-gray-50">
    </div>
  </div>
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Unggah Surat Permohonan</label>
    <div class="flex items-center gap-3">
      <label class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl cursor-pointer transition">
        Pilih File
        <input type="file" name="surat" required class="hidden">
      </label>
      <span class="text-sm text-gray-400 file-name">Belum ada file</span>
    </div>
  </div>
  <button type="submit" class="w-full py-3 bg-brand hover:bg-brand-dark text-white font-semibold rounded-xl transition shadow-md">
    Kirim Permohonan
  </button>
</form>
<script>
  document.querySelector('input[type=file]').addEventListener('change', function(e) {
    var name = e.target.files[0] ? e.target.files[0].name : 'Belum ada file';
    document.querySelector('.file-name').textContent = name;
  });
</script>
