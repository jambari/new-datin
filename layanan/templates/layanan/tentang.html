{% extends 'layanan/base.html' %}
{% load static %}

{% block title %}Tentang — BukaData{% endblock %}

{% block content %}
<section class="max-w-4xl mx-auto px-4 py-12">
  <nav class="flex items-center gap-2 text-sm text-gray-500 mb-8">
    <a href="{% url 'layanan_landing' %}" class="hover:text-brand">Home</a>
    <span>/</span>
    <span class="text-gray-900 font-medium">Tentang</span>
  </nav>
  <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-8">Tentang Layanan</h1>
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-10">
    <img src="{% static 'images/layanan/tentang.png' %}" alt="Tentang BukaData" class="w-full">
  </div>
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <h2 class="text-xl font-bold text-gray-900 mb-4">Dasar Hukum</h2>
    <div class="w-full h-[800px] rounded-lg overflow-hidden border">
      <object data="{% static 'images/layanan/dasarhukum.pdf' %}" type="application/pdf" class="w-full h-full">
        <p class="p-4 text-gray-500">PDF tidak dapat ditampilkan. <a href="{% static 'images/layanan/dasarhukum.pdf' %}" class="text-brand underline">Download</a>.</p>
      </object>
    </div>
  </div>
</section>
{% endblock %}
