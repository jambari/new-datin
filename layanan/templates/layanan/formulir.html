{% extends 'layanan/base.html' %}
{% load static %}

{% block title %}Formulir — {{ jenis_data }}{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto px-4 py-12">
  <nav class="flex items-center gap-2 text-sm text-gray-500 mb-8">
    <a href="{% url 'layanan_landing' %}" class="hover:text-brand">Home</a><span>/</span>
    <span class="text-gray-900 font-medium">Formulir</span>
  </nav>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8 text-center">
    <h3 class="text-lg font-bold text-gray-700 mb-3">Contoh: {{ jenis_data }}</h3>
    <img src="{% static 'images/layanan/' %}{{ jpg }}" alt="{{ jenis_data }}" class="max-w-full mx-auto rounded-xl shadow-sm">
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Formulir Permohonan</h2>
    {% include 'layanan/_form.html' with jenis_default=jenis_data %}
  </div>
</section>
{% endblock %}
