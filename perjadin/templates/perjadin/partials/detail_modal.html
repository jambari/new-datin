<div style="max-height: 400px; overflow-y: auto;">
    <h4>Riwayat Perjadin: <strong>{{ pegawai.nama }}</strong></h4>
    <table class="table-perjadin">
        <thead>
            <tr>
                <th>Tujuan</th>
                <th>Kegiatan</th>
                <th>Jenis</th>
                <th>Tanggal</th>
                <th>Lumsum</th>
            </tr>
        </thead>
        <tbody>
            {% for trip in trips %}
            <tr>
                <td style="text-align:left;">{{ trip.tujuan }}</td>
                <td style="text-align:left;">{{ trip.kegiatan }}</td>
                <td>{{ trip.jenis.nama }}</td>
                <td>{{ trip.tgl_mulai }} s/d {{ trip.tgl_selesai }}</td>
                <td style="text-align:right;">Rp {{ trip.total_biaya|floatformat:0 }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="4">Tidak ada data.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
