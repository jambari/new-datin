{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Tamu — Buku Tamu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:'#C30F42'}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/webcamjs/1.0.26/webcam.min.js"></script>
  <style>*{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b border-gray-100">
  <div class="max-w-4xl mx-auto px-4 h-16 flex items-center gap-4">
    <a href="{% url 'guests_index' %}" class="text-gray-400 hover:text-gray-600 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    </a>
    <h1 class="font-bold text-lg text-gray-900">Tambah Tamu</h1>
  </div>
</header>

<div class="max-w-4xl mx-auto px-4 py-10">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
    <form method="POST" class="grid grid-cols-1 md:grid-cols-5 divide-y md:divide-y-0 md:divide-x divide-gray-100">
      {% csrf_token %}

      <!-- Left: form fields -->
      <div class="md:col-span-3 p-6 md:p-8 space-y-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nama <span class="text-brand">*</span></label>
            <input type="text" name="nama" required placeholder="Nama lengkap"
              class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Dari <span class="text-brand">*</span></label>
            <input type="text" name="dari" required placeholder="Instansi / asal"
              class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition">
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Keperluan <span class="text-brand">*</span></label>
          <input type="text" name="keperluan" required placeholder="Tujuan kunjungan"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Keterangan</label>
          <textarea name="keterangan" rows="2" placeholder="Catatan tambahan..."
            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition resize-none"></textarea>
        </div>
        <input type="hidden" name="foto" id="fotoData">
        <button type="submit" class="w-full py-3 bg-brand hover:bg-red-700 text-white font-semibold rounded-xl transition shadow-md">
          Simpan Tamu
        </button>
      </div>

      <!-- Right: photo (webcam + file upload fallback) -->
      <div class="md:col-span-2 p-6 md:p-8 bg-gray-50 flex flex-col items-center justify-center gap-4">
        <p class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Foto</p>

        <!-- Webcam (hidden until available) -->
        <div id="webcamSection" class="w-full flex flex-col items-center gap-3 hidden">
          <div id="my_camera" class="w-full max-w-[280px] aspect-[4/3] rounded-xl overflow-hidden bg-gray-900 shadow-inner"></div>
          <div id="my_result" class="w-full max-w-[280px] aspect-[4/3] rounded-xl overflow-hidden bg-gray-100 border border-gray-200 flex items-center justify-center text-gray-300 text-sm">
            Klik "Ambil Foto"
          </div>
          <button type="button" onclick="takeSnapshot()" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-900 text-white text-sm font-medium rounded-xl transition">
            📸 Ambil Foto
          </button>
        </div>

        <!-- File upload (default, always shown) -->
        <div id="uploadSection" class="w-full flex flex-col items-center gap-3">
          <div id="uploadPreview" class="w-full max-w-[280px] aspect-[4/3] rounded-xl overflow-hidden bg-gray-100 border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400 text-sm text-center p-4 cursor-pointer hover:border-brand hover:text-brand transition">
            <span>Klik untuk unggah foto</span>
          </div>
          <label class="px-5 py-2.5 bg-gray-700 hover:bg-gray-800 text-white text-sm font-medium rounded-xl transition cursor-pointer">
            📁 Pilih File
            <input type="file" id="fileInput" accept="image/*" class="hidden">
          </label>
        </div>

        <p id="webcamNotice" class="text-xs text-amber-600 bg-amber-50 px-3 py-2 rounded-lg text-center max-w-[280px] hidden">
          ⚠️ Kamera tidak tersedia (butuh HTTPS). Gunakan unggah file.
        </p>
      </div>
    </form>
  </div>
</div>

<script>
  function showUploadFallback() {
    document.getElementById('webcamSection').classList.add('hidden');
    document.getElementById('uploadSection').classList.remove('hidden');
    document.getElementById('webcamNotice').classList.remove('hidden');
  }

  function takeSnapshot() {
    Webcam.snap(function(dataUri) {
      document.getElementById('my_result').innerHTML = '<img src="'+dataUri+'" class="w-full h-full object-cover"/>';
      document.getElementById('fotoData').value = dataUri.replace(/^data:image\/\w+;base64,/, '');
    });
  }

  // File upload → base64
  document.getElementById('fileInput').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      var base64 = ev.target.result.replace(/^data:image\/\w+;base64,/, '');
      document.getElementById('fotoData').value = base64;
      document.getElementById('uploadPreview').innerHTML = '<img src="'+ev.target.result+'" class="w-full h-full object-cover"/>';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('uploadPreview').addEventListener('click', function() {
    document.getElementById('fileInput').click();
  });

  // Try webcam — only works on HTTPS / localhost
  try {
    Webcam.set({
      width: 320, height: 240,
      dest_width: 320, dest_height: 240,
      image_format: 'png', jpeg_quality: 90
    });
    Webcam.attach('#my_camera');
    Webcam.on('load', function() {
      document.getElementById('webcamSection').classList.remove('hidden');
      document.getElementById('uploadSection').classList.add('hidden');
      document.getElementById('webcamNotice').classList.add('hidden');
    });
    Webcam.on('error', function() { showUploadFallback(); });
  } catch(e) { showUploadFallback(); }
</script>

</body>
</html>
